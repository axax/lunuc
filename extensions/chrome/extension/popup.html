<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<button id="downloadMp3" class="btn">YouTube → mp3</button>

<h3>Medien auf dieser Seite</h3>
<p class="hint">Video einmal abspielen, damit Streams erkannt werden.</p>
<label class="field">Dateiname <input type="text" id="fileName" spellcheck="false"></label>
<label class="field">Qualität
    <select id="quality">
        <option value="original">Original (schnell, keine Neukodierung)</option>
        <option value="1080p">1080p H.264 – gute Qualität</option>
        <option value="720p">720p H.264 – kleiner, läuft überall</option>
        <option value="480p">480p H.264 – sehr klein</option>
        <option value="1080p-hevc">1080p H.265 – ca. 40 % kleiner, langsamer</option>
        <option value="720p-hevc">720p H.265 – sehr klein, langsamer</option>
    </select>
</label>
<ul id="mediaList"></ul>
<div id="subtitleBox">
    <h4>Untertitel</h4>
    <label class="check"><input type="checkbox" id="streamSubtitles"> Untertitel aus dem Stream (HLS/DASH) einbinden</label>
    <ul id="subtitleList"></ul>
</div>
<div class="row">
    <button id="rescan" class="btn small">Neu scannen</button>
    <button id="clear" class="btn small">Liste leeren</button>
    <button id="options" class="btn small">Einstellungen</button>
</div>

<h3>Downloads</h3>
<ul id="jobList"></ul>
<div class="row">
    <button id="clearJobs" class="btn small">Erledigte entfernen</button>
</div>
<script src="lang.js"></script>
<script src="popup.js"></script>
</body>
</html>
