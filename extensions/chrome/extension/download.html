<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stream Download</title>
    <style>
        body { font: 14px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; }

        .error { color: #b00020; }

<script src="download.js"></script>

</html>
