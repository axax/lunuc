<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lunuc Extension – Einstellungen</title>
    <style>
        body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 16px; }
        h2 { margin-bottom: 4px; }
        fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 12px 16px; margin: 16px 0; }
        legend { font-weight: 600; padding: 0 4px; }
        label { display: block; margin: 8px 0 2px; }
        label.check { display: flex; gap: 6px; align-items: center; }
        input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .hint { color: #666; font-size: 12px; }
        .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
        button { padding: 6px 12px; border: none; border-radius: 4px; background: #2b7a3d; color: #fff; cursor: pointer; }
        button.secondary { background: #555; }
        #msg { font-size: 13px; }
        .ok { color: #2b7a3d; } .err { color: #b00020; }
    </style>
</head>
<body>
<h2>Einstellungen</h2>
<p class="hint" id="helper">Prüfe ffmpeg-Helfer…</p>

<fieldset>
    <legend>Upload nach dem Umwandeln</legend>
    <label class="check"><input type="checkbox" id="enabled"> Fertige MP4 automatisch hochladen</label>

    <label for="url">Zielverzeichnis</label>
    <input type="text" id="url" placeholder="ftp://ftp.example.com/filme/">
    <div class="hint">ftp://, ftps:// oder sftp:// (SFTP nur, wenn das lokale curl es unterstützt)</div>

    <label for="user">Benutzer</label>
    <input type="text" id="user" autocomplete="off">

    <label for="password">Passwort</label>
    <input type="password" id="password" autocomplete="new-password">
    <div class="hint">Wird lokal im Browserprofil gespeichert (unverschlüsselt). Leer lassen und „~/.netrc verwenden“ aktivieren, wenn du das nicht willst.</div>

    <label class="check"><input type="checkbox" id="netrc"> ~/.netrc verwenden (statt Benutzer/Passwort)</label>
    <label class="check"><input type="checkbox" id="ssl"> TLS erzwingen (FTPS)</label>
    <label class="check"><input type="checkbox" id="deleteAfterUpload"> Lokale MP4 nach erfolgreichem Upload löschen</label>

    <div class="row">
        <button id="save">Speichern</button>
        <button id="test" class="secondary">Verbindung testen</button>
        <span id="msg"></span>
    </div>
</fieldset>

<script src="options.js"></script>
</body>
</html>
